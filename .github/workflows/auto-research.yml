name: auto-research
# 无人值守的长期探索：每天自动生成并检验新假设，不需要人说话，不消耗对话 token。
on:
  schedule:
    # 北京时间 09:00（UTC 01:00）。与 daily-predict 错开，避免同时改仓库。
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      n:
        description: '本轮生成多少条新假设'
        required: false
        default: '6'
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 拉取全量开奖数据（不存在则生成）
        run: |
          mkdir -p meeting3
          if [ ! -f meeting3/draws_8825_full.json ]; then
            echo "缺少全量数据，尝试从仓库 scripts/ 下的缓存恢复"
            ls -la meeting3/ || true
          fi
      - name: 自动生成并检验新假设
        run: python auto_explore.py --n ${{ github.event.inputs.n || '6' }}
      - name: 导出研究状态供可视化页面读取
        run: python auto_explore.py --status-only || true
      - name: 提交结果
        run: |
          git config user.name "fucai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meeting3/auto_registry.json meeting3/auto_shadow.json meeting3/research_status.json research.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "自动探索 $(date -u +%F)"
          git push
