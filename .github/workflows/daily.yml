name: daily-predict
on:
  schedule:
    # 22:00 北京时间 = 14:00 UTC（北京时间无夏令时，全年稳定）
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓开奖并更新每日预测区块
        run: python scripts/daily_predict.py
      - name: 提交并推送
        run: |
          git config user.name "fucai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "每日预测自动更新 $(date -u +%F_%T)"
          git push
