name: daily-predict
on:
  schedule:
    # 北京时间 22:00 与 23:00（UTC 14:00 / 15:00）。跑两次做冗余：
    # GitHub cron 会延迟 5~50 分钟，且数据源偶发不可用；脚本幂等，重复跑不会产生重复期号。
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓开奖并更新每日预测区块
        run: python scripts/daily_predict.py
      - name: 提交并推送
        run: |
          git config user.name "fucai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "每日预测自动更新 $(date -u +%F_%T)"
          git push
