name: daily-predict
on:
  schedule:
    # 北京时间 22:00 / 23:00 / 次日 00:00 / 01:00（UTC 14/15/16/17）。
    # 实测 GitHub 免费额度 cron 会延迟数小时（2026-11-27 实测延迟约 8.5 小时，
    # 14:00 UTC 的 run 直到 22:34 UTC 才启动），单个 cron 不可靠。
    # 因此排 4 个冗余点：任一次成功即更新到位；脚本幂等，重复跑不会产生重复期号。
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓开奖并更新每日预测区块
        run: python scripts/daily_predict.py
      - name: 提交并推送
        run: |
          git config user.name "fucai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "每日预测自动更新 $(date -u +%F_%T)"
          git push
